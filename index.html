<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Office Simulator - Visualize multi-agent AI orchestration as an animated pixel office">
  <title>AI Office Simulator — 8-Bit Multi-Agent Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Top Navigation Bar -->
  <nav class="navbar" id="navbar">
    <div class="nav-brand">
      <div class="pixel-logo-icon" id="pixelLogoIcon" title="AI Office Simulator">
        <svg class="pixel-svg-logo" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
          <!-- Monitor Frame -->
          <rect x="2" y="2" width="28" height="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
          <!-- Monitor Screen -->
          <rect x="5" y="5" width="22" height="16" fill="#1e293b"/>
          <!-- AI Brain / Pulse Grid on Screen -->
          <rect x="8" y="10" width="3" height="6" fill="#38bdf8"/>
          <rect x="11" y="8" width="3" height="10" fill="#a855f7"/>
          <rect x="14" y="7" width="4" height="12" fill="#22c55e" class="pixel-logo-pulse"/>
          <rect x="18" y="8" width="3" height="10" fill="#a855f7"/>
          <rect x="21" y="10" width="3" height="6" fill="#38bdf8"/>
          <!-- Blinking Pixel Eye / Terminal Prompt -->
          <rect x="9" y="12" width="2" height="2" fill="#ffffff"/>
          <rect x="21" y="12" width="2" height="2" fill="#ffffff"/>
          <!-- Monitor Stand & Base -->
          <rect x="13" y="24" width="6" height="4" fill="#334155"/>
          <rect x="8" y="28" width="16" height="2" fill="#38bdf8"/>
          <!-- Neon Power LED -->
          <rect x="25" y="22" width="2" height="2" fill="#22c55e" class="pixel-led"/>
        </svg>
      </div>
      <div class="logo-title-group">
        <h1 class="logo-text"><span class="logo-ai">AI</span> OFFICE</h1>
        <span class="logo-badge">SIMULATOR v2.0</span>
      </div>
    </div>
    <div class="nav-center">
      <div class="status-pill" id="systemStatus">
        <span class="status-dot online"></span>
        <span class="status-label">[SYSTEM ONLINE]</span>
      </div>
    </div>
    <div class="nav-actions">
      <button class="btn-team-setup" id="teamSetupToggle" title="Configure Subagents & Custom Prompts">
        <span class="team-btn-icon">👥</span>
        <span class="btn-label">SUBAGENTS</span>
      </button>
      <button class="btn-icon" id="settingsToggle" title="API Settings & Key Setup" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
          <rect x="3" y="3" width="18" height="18" rx="0"/>
          <path d="M12 8v8M8 12h8"/>
        </svg>
      </button>
      <button class="btn-icon" id="themeToggle" title="Toggle Theme" aria-label="Toggle Theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="6" height="6" fill="currentColor"/>
          <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="btn-icon" id="fullscreenToggle" title="Fullscreen" aria-label="Toggle Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="main-content" id="mainContent">
    <!-- Left Panel: 2D Office Visualization (Clean Full Height) -->
    <section class="office-panel" id="officePanel">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="officeCanvas"></canvas>
        <!-- Speech bubbles rendered as HTML overlays -->
        <div class="speech-bubble-layer" id="speechBubbleLayer"></div>
        
        <!-- Retro Pixel Zoom Controls -->
        <div class="floating-zoom-controls" id="zoomControls">
          <button class="btn-zoom" id="zoomOutBtn" title="Zoom Out" aria-label="Zoom Out">-</button>
          <span class="zoom-level" id="zoomDisplay">100%</span>
          <button class="btn-zoom" id="zoomInBtn" title="Zoom In" aria-label="Zoom In">+</button>
          <button class="btn-zoom" id="zoomResetBtn" title="Reset Zoom" aria-label="Reset Zoom">RESET</button>
        </div>
      </div>
    </section>

    <!-- Resizable Divider -->
    <div class="panel-divider" id="panelDivider">
      <div class="divider-handle"></div>
    </div>

    <!-- Right Panel: Chat Interface -->
    <section class="chat-panel" id="chatPanel">
      <div class="panel-header">
        <h2 class="panel-title">
          <span class="pixel-dot-indicator"></span>
          <span>TERMINAL CHAT</span>
        </h2>
        <div class="model-selector-wrapper">
          <select class="model-selector" id="modelSelector">
            <optgroup label="Google">
              <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
              <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
              <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
            </optgroup>
            <optgroup label="OpenAI">
              <option value="gpt-4o">GPT-4o</option>
              <option value="gpt-4o-mini">GPT-4o Mini</option>
            </optgroup>
            <optgroup label="Anthropic">
              <option value="claude-sonnet-4">Claude Sonnet 4</option>
              <option value="claude-haiku-3.5">Claude Haiku 3.5</option>
            </optgroup>
          </select>
        </div>
      </div>

      <!-- Chat Messages Area -->
      <div class="chat-messages" id="chatMessages">
        <div class="welcome-message">
          <div class="welcome-icon-box">👾</div>
          <h3 class="welcome-heading">MISSION CONTROL ACTIVE</h3>
          <p class="welcome-desc">Transmit an assignment or query. Watch Manager & specialist subagents mobilize across desks in real time.</p>
          <div class="welcome-tags">
            <span class="pixel-tag">[MULTI-AGENT]</span>
            <span class="pixel-tag">[AUTONOMOUS]</span>
            <span class="pixel-tag">[8-BIT ORCHESTRATION]</span>
          </div>
        </div>
      </div>

      <!-- Chat Input -->
      <div class="chat-input-area" id="chatInputArea">
        <div class="input-wrapper">
          <button class="btn-voice" id="voiceBtn" title="Voice Input" aria-label="Voice Input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <textarea class="message-input" id="messageInput" placeholder="Ask the office team something..." rows="1"></textarea>
          <button class="btn-send" id="sendBtn" title="Send Message" aria-label="Send Message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">
          Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
